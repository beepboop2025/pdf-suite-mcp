name: publish

# Publish to npm and the MCP registry when a GitHub release is cut (or run
# manually). Needs one secret for npm (Settings -> Secrets -> Actions):
#   NPM_TOKEN   an npm automation token (bypasses interactive 2FA)
# The MCP registry step authenticates with the workflow's own OIDC token.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      manifest:
        description: Registry manifest to publish
        required: true
        default: server.json
        type: choice
        options:
          - server.json
          - registry/pdf-toolkit-mcp.server.json

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN not set — skipping npm publish."
            exit 0
          fi
          npm publish --access public

  registry:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: "1.8.1"
      MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        run: |
          curl --fail --silent --show-error --location \
            --output mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file mcp-publisher.tar.gz mcp-publisher
          chmod 0755 mcp-publisher
      - name: Publish the selected registry manifest
        env:
          MCP_MANIFEST: ${{ inputs.manifest || 'server.json' }}
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish "$MCP_MANIFEST"
